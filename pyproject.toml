[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aassr-v2"
version = "0.3.0"
description = "A from-scratch AASSR research implementation with learned Prophecy, GOALs, Skills and plugin actions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.6"]
gpu = ["torch>=2.2"]
paper = [
  "torch>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "cuda: requires a CUDA-enabled PyTorch installation and visible GPU",
  "docker: requires a running local Docker engine",
]
