name: long-horizon-goal-only-debug

on:
  push:
    branches: [codex/aassr-v2-imagination-counterfactual-audit]
    paths:
      - ".github/workflows/long-horizon-goal-only-debug.yml"
  workflow_dispatch:

jobs:
  goal-only:
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 42]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Run GOAL-only long-horizon diagnostic
        shell: bash
        run: |
          python - <<'PY'
          from aassr_v2.long_horizon_goal_experiment import run_long_horizon_goal_experiment
          run_long_horizon_goal_experiment(
              "runs/goal_only_${{ matrix.seed }}",
              seeds=(${{ matrix.seed }},),
              conditions=("goal_maker_executor",),
              train_episodes=2000,
              train_map_count=32,
              evaluation_episodes=80,
              training_tail=200,
              stage_count=10,
              room_length=6,
          )
          PY
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: goal-only-seed-${{ matrix.seed }}-${{ github.sha }}
          path: runs/goal_only_${{ matrix.seed }}
          retention-days: 30
