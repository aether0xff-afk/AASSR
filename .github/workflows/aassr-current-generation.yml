name: AASSR current-generation gate

on:
  push:
    branches: [agent/aassr-current-generation]
  pull_request:
    paths:
      - "src/aassr_v2/current_generation.py"
      - "src/aassr_v2/current_runtime.py"
      - "src/aassr_v2/current_performance.py"
      - "src/aassr_v2/current_entrypoint.py"
      - "src/aassr_v2/current_protocol.py"
      - "src/aassr_v2/pentest_current_generation_smoke.py"
      - "src/aassr_v2/pentest_current_generation_main.py"
      - "src/aassr_v2/__init__.py"
      - "scripts/run_pentest_current_generation_smoke.py"
      - "scripts/run_pentest_current_generation_main.py"
      - "tests/test_current_generation*.py"
      - "tests/test_current_default_entrypoint.py"
      - ".github/workflows/aassr-current-generation.yml"
  workflow_dispatch:

concurrency:
  group: aassr-current-generation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install current-generation dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82"
          python -m pip install -e ".[dev,gpu]"
      - name: Compile current-generation runtime
        run: |
          python -m py_compile src/aassr_v2/current_generation.py
          python -m py_compile src/aassr_v2/current_runtime.py
          python -m py_compile src/aassr_v2/current_performance.py
          python -m py_compile src/aassr_v2/current_entrypoint.py
          python -m py_compile src/aassr_v2/current_protocol.py
          python -m py_compile src/aassr_v2/pentest_current_generation_smoke.py
          python -m py_compile src/aassr_v2/pentest_current_generation_main.py
          python -m py_compile src/aassr_v2/__init__.py
          python -m py_compile scripts/run_pentest_current_generation_smoke.py
          python -m py_compile scripts/run_pentest_current_generation_main.py
          python -m py_compile tests/test_current_generation.py
          python -m py_compile tests/test_current_generation_batching.py
          python -m py_compile tests/test_current_default_entrypoint.py
      - name: Assert current runtime does not import frozen v0.4 runner
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in (
              "src/aassr_v2/current_protocol.py",
              "src/aassr_v2/pentest_current_generation_smoke.py",
              "src/aassr_v2/pentest_current_generation_main.py",
          ):
              text = Path(name).read_text(encoding="utf-8")
              assert "pentest_v040_full_system_main" not in text, name
          PY
      - name: Assert active architecture rename invariance and batching
        run: |
          pytest -q \
            tests/test_current_generation.py \
            tests/test_current_generation_batching.py \
            tests/test_current_default_entrypoint.py
      - name: Run same-checkpoint real-environment learning smoke
        run: |
          python scripts/run_pentest_current_generation_smoke.py \
            --output runs/current_generation_smoke.json \
            --transition-budget 192 \
            --device cpu
      - name: Assert real learners updated and evaluation stayed frozen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("runs/current_generation_smoke.json").read_text())
          assert result["same_checkpoint_verified"] is True
          assert result["legacy_components_active"] == []
          diagnostics = result["diagnostics"]
          assert diagnostics["policy"]["dqn:gradient_updates"] > 0
          assert diagnostics["prophecy_current"]["gradient_updates"] > 0
          assert diagnostics["calibration_same_transition_frozen"] is True
          print(
              "train_successes=", result["training_successes"],
              "dqn_updates=", diagnostics["policy"]["dqn:gradient_updates"],
              "prophecy_updates=", diagnostics["prophecy_current"]["gradient_updates"],
              "critic_ready=", result["critic_ready"],
              "no_img=", result["no_imagination_successes"],
              "full=", result["full_successes"],
          )
          PY
      - name: Print active component manifest
        run: |
          python - <<'PY'
          import aassr_v2
          from aassr_v2 import (
              CURRENT_COMPONENTS,
              CURRENT_GENERATION_VERSION,
              LEGACY_COMPONENTS_ACTIVE,
              build_current_pentest_aassr_core,
          )
          print(CURRENT_GENERATION_VERSION)
          for key, value in CURRENT_COMPONENTS.items():
              print(f"{key}: {value}")
          assert LEGACY_COMPONENTS_ACTIVE == ()
          assert aassr_v2.build_pentest_aassr_core is build_current_pentest_aassr_core
          agent = build_current_pentest_aassr_core(
              seed=7,
              train_transitions=64,
              use_imagination=True,
              device="cpu",
          )
          diagnostics = agent.diagnostics()
          assert diagnostics["canonical_runtime"] == "current_runtime"
          assert agent.current_depth_batching is True
          PY
      - name: Archive current-generation smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aassr-current-generation-smoke
          path: runs/current_generation_smoke.json
          if-no-files-found: warn
