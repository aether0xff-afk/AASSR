name: AASSR current-generation gate

on:
  push:
    branches: [agent/aassr-current-generation]
  pull_request:
    paths:
      - "src/aassr_v2/current_generation.py"
      - "src/aassr_v2/current_runtime.py"
      - "src/aassr_v2/__init__.py"
      - "tests/test_current_generation.py"
      - ".github/workflows/aassr-current-generation.yml"
  workflow_dispatch:

concurrency:
  group: aassr-current-generation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install current-generation dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82"
          python -m pip install -e ".[dev,gpu]"
      - name: Compile current-generation runtime
        run: |
          python -m py_compile src/aassr_v2/current_generation.py
          python -m py_compile src/aassr_v2/current_runtime.py
          python -m py_compile src/aassr_v2/__init__.py
          python -m py_compile tests/test_current_generation.py
      - name: Assert active architecture and rename invariance
        run: pytest -q tests/test_current_generation.py
      - name: Print active component manifest
        run: |
          python - <<'PY'
          from aassr_v2 import (
              CURRENT_COMPONENTS,
              CURRENT_GENERATION_VERSION,
              LEGACY_COMPONENTS_ACTIVE,
              build_current_pentest_aassr_core,
          )
          print(CURRENT_GENERATION_VERSION)
          for key, value in CURRENT_COMPONENTS.items():
              print(f"{key}: {value}")
          assert LEGACY_COMPONENTS_ACTIVE == ()
          agent = build_current_pentest_aassr_core(
              seed=7,
              train_transitions=64,
              use_imagination=True,
              device="cpu",
          )
          assert agent.diagnostics()["canonical_runtime"] == "current_runtime"
          PY
