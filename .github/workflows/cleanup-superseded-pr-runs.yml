name: cleanup-superseded-pr-runs

on:
  push:
    branches:
      - codex/aassr-v2-imagination-counterfactual-audit

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-old-runs:
    runs-on: macos-latest
    steps:
      - name: Cancel older active runs for this branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const currentSha = context.sha;
            const statuses = ['queued', 'in_progress', 'pending', 'waiting', 'requested'];
            let cancelled = 0;

            for (const status of statuses) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch,
                status,
                per_page: 100,
              });
              for (const run of response.data.workflow_runs) {
                if (run.head_sha === currentSha || run.id === context.runId) {
                  continue;
                }
                try {
                  await github.rest.actions.cancelWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  cancelled += 1;
                  core.info(`cancelled ${run.name} #${run.run_number} (${run.id})`);
                } catch (error) {
                  core.warning(`could not cancel ${run.id}: ${error.message}`);
                }
              }
            }
            core.info(`cancelled ${cancelled} superseded workflow runs`);
