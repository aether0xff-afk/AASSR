name: AASSR v0.4 local acceleration

on:
  pull_request:
    paths:
      - "src/aassr_v2/torch_gru_prophecy.py"
      - "src/aassr_v2/local_acceleration.py"
      - "src/aassr_v2/pentest_v040_local_4090.py"
      - "src/aassr_v2/replay.py"
      - "src/aassr_v2/skills.py"
      - "scripts/run_pentest_v040_local_4090.py"
      - "tests/test_v040_local_acceleration.py"
      - ".github/workflows/aassr-v040-local-acceleration.yml"
  workflow_dispatch:

jobs:
  equivalence-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install torch path
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,gpu]"
      - name: Compile local acceleration path
        run: |
          python -m compileall -q \
            src/aassr_v2/torch_gru_prophecy.py \
            src/aassr_v2/local_acceleration.py \
            src/aassr_v2/pentest_v040_local_4090.py \
            scripts/run_pentest_v040_local_4090.py
      - name: Canonical and batch equivalence regressions
        run: pytest -q tests/test_v040_local_acceleration.py
      - name: Tiny full-system local backend smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from aassr_v2.pentest_v040_local_4090 import run_local_condition

          with TemporaryDirectory() as tmp:
              summary = run_local_condition(
                  Path(tmp) / "cell",
                  condition="aassr_v040_no_imagination",
                  research_seed=7,
                  transition_budget=12,
                  block_target=6,
                  device="cpu",
                  dtype="float64",
                  tf32=False,
                  cpu_threads=2,
                  train_seeds=(90001, 90002),
                  validation_seeds=(93001,),
                  diagnostic_seeds=(92001,),
              )
              assert summary["transitions_used"] == 12
              assert summary["exact_budget"] is True
              assert summary["final_blind_consumed"] is False
              assert summary["local_acceleration"]["prophecy_backend"] == "torch-canonical-gru"
              runtime = summary["local_acceleration"]["validator_runtime"]
              assert runtime["batch_calls"] > 0
              assert all(row["episodes"] == 1 for row in summary["diagnostic"])
          PY
