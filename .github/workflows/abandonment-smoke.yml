name: abandonment-smoke

on:
  push:
    branches:
      - codex/aassr-v2-abandonment-smoke
  pull_request:
    paths:
      - "src/aassr_v2/abandonment_smoke.py"
      - "src/aassr_v2/abandonment_smoke_runner.py"
      - "scripts/run_abandonment_smoke.py"
      - "tests/test_abandonment_smoke.py"
      - ".github/workflows/abandonment-smoke.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and focused tests
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_abandonment_smoke.py tests/test_imagination_v2.py

  smoke:
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen-critic abandonment smoke
        run: |
          python scripts/run_abandonment_smoke.py \
            --output runs/abandonment_smoke \
            --seed 7 \
            --train-episodes 1000 \
            --train-map-count 64 \
            --evaluation-episodes 30 \
            --thresholds 0.05 0.15 0.30 \
            --minimum-steps 2 \
            --patience 2 \
            --safety-cap 128
      - uses: actions/upload-artifact@v4
        with:
          name: abandonment-smoke-${{ github.sha }}
          path: runs/abandonment_smoke
          if-no-files-found: error
