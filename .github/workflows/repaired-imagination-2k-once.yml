name: Repaired Imagination 2k one-shot

on:
  workflow_dispatch:

jobs:
  repaired-imagination-2k:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout AASSR
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AASSR test/runtime dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82"
          python -m pip install -e ".[dev,gpu]"

      - name: Run repaired Imagination 2k same-checkpoint validation
        run: |
          python scripts/run_repaired_imagination_final.py \
            --output-dir runs/repaired_imagination_2k_status_v3_seed7_actions \
            --seed 7 \
            --transitions 2048 \
            --block-target 512 \
            --margin 0.05 \
            --max-level 4 \
            --seed-count 4 \
            --device cpu

      - name: Print final summary
        if: always()
        run: |
          if [ -f runs/repaired_imagination_2k_status_v3_seed7_actions/summary.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('runs/repaired_imagination_2k_status_v3_seed7_actions/summary.json')
          data = json.loads(p.read_text())
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
          else
            echo "summary.json not produced"
          fi

      - name: Archive repaired Imagination 2k results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repaired-imagination-2k-status-v3-seed7-actions
          path: runs/repaired_imagination_2k_status_v3_seed7_actions
          if-no-files-found: warn
          retention-days: 30
