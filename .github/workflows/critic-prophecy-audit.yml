name: critic-prophecy-audit

on:
  push:
    branches:
      - codex/aassr-v2-critic-prophecy-audit
  pull_request:
    paths:
      - "src/aassr_v2/branch_critic.py"
      - "src/aassr_v2/transition_prefix_prophecy.py"
      - "src/aassr_v2/critic_prophecy_common.py"
      - "src/aassr_v2/prophecy_one_step_audit.py"
      - "src/aassr_v2/critic_pruning_audit.py"
      - "src/aassr_v2/critic_prophecy_audit.py"
      - "scripts/run_critic_prophecy_audit.py"
      - "tests/test_critic_prophecy_audit.py"
      - ".github/workflows/critic-prophecy-audit.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and focused tests
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_critic_prophecy_audit.py

  five-seed-pilot:
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 13, 21, 42, 100]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run isolated audit
        run: |
          python scripts/run_critic_prophecy_audit.py \
            --output runs/critic_prophecy_seed_${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --train-map-count 8 \
            --unseen-map-count 16 \
            --behavior-train-episodes 1000 \
            --critic-train-episodes 400 \
            --critic-eval-episodes 100 \
            --prophecy-train-episodes 600 \
            --prophecy-eval-episodes 100 \
            --pruning-depth 16 \
            --pruning-beam-width 4
      - uses: actions/upload-artifact@v4
        with:
          name: critic-prophecy-seed-${{ matrix.seed }}-${{ github.sha }}
          path: runs/critic_prophecy_seed_${{ matrix.seed }}
          if-no-files-found: error
