name: AASSR v0.4 integration

on:
  push:
    branches:
      - agent/aassr-v0.4-integration
  pull_request:
    paths:
      - "src/aassr_v2/integrated_agent.py"
      - "src/aassr_v2/learning.py"
      - "src/aassr_v2/gru_prophecy.py"
      - "src/aassr_v2/semantic_control.py"
      - "src/aassr_v2/__init__.py"
      - "tests/test_v040_integration.py"
      - "tests/test_v040_prophecy_context.py"
      - "tests/test_v040_final_audit.py"
      - "docs/releases/v0.4.0.md"
      - "CHANGELOG.md"
      - ".github/workflows/aassr-v040-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Focused 0.4 regressions
        run: >-
          pytest -q
          tests/test_v040_integration.py
          tests/test_v040_prophecy_context.py
          tests/test_v040_final_audit.py
          tests/test_roadmap_completion.py
          tests/test_pentest_curriculum_causal.py
          tests/test_pentest_training_mechanism_main.py
      - name: Package version is coherent
        run: >-
          python -c "import importlib.metadata as m, aassr_v2;
          assert aassr_v2.__version__ == '0.4.0';
          assert m.version('aassr-v2') == '0.4.0'"
