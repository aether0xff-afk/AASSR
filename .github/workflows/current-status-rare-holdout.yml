name: Current Prophecy rare-status holdout

on:
  pull_request:
    paths:
      - "src/aassr_v2/current_status_models.py"
      - "src/aassr_v2/current_relational_state_v3.py"
      - "src/aassr_v2/current_relational_model.py"
      - "src/aassr_v2/current_relational_mixture_model.py"
      - "scripts/run_current_status_rare_holdout.py"
      - ".github/workflows/current-status-rare-holdout.yml"
  workflow_dispatch:

concurrency:
  group: current-status-rare-holdout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rare-status-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip "setuptools<82"
          python -m pip install -e ".[dev,gpu]"

      - name: Compile diagnostic
        run: python -m py_compile scripts/run_current_status_rare_holdout.py src/aassr_v2/current_status_models.py

      - name: Run real-transition held-out status diagnostic
        run: |
          python scripts/run_current_status_rare_holdout.py \
            --output runs/current_status_rare_holdout.json \
            --research-seed 7 \
            --train-seed-count 16 \
            --holdout-seed-count 8 \
            --steps-per-episode 48 \
            --samples 3 \
            --device cpu

      - name: Check generic survival criterion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("runs/current_status_rare_holdout.json").read_text())
          assert result["uses_hidden_correctness"] is False
          assert result["uses_final_blind_seeds"] is False
          assert result["status_objective"] == "class-balanced-categorical-public-http-status-v2"
          gate = result["minimal_survival_gate"]
          print("train counts:", result["train_status_counts"])
          print("holdout counts:", result["holdout_status_counts"])
          print("frequency groups:", result["frequency_groups"])
          print("rare group:", result["rare_group"])
          print("common group:", result["common_group"])
          print("zero-topk supported statuses:", result["eligible_zero_topk_statuses"])
          # A passing result must cover a broad set of naturally occurring public
          # outcomes. This prevents a false green from evaluating only 200/404 and
          # a couple of easy minority classes. No particular HTTP code is named.
          assert gate["eligible_status_count"] >= 5, gate
          assert gate["rare_status_count"] >= 2, gate
          assert gate["all_supported_statuses_have_nonzero_topk"] is True, result["eligible_zero_topk_statuses"]
          assert gate["rare_group_has_nonzero_topk"] is True, result["rare_group"]
          PY

      - name: Archive rare-status diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-status-rare-holdout
          path: runs/current_status_rare_holdout.json
          if-no-files-found: warn
          retention-days: 30
