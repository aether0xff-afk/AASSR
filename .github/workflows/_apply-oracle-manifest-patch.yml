name: apply-oracle-manifest-patch

on:
  push:
    branches: [codex/aassr-v2-imagination-counterfactual-audit]
    paths:
      - "scripts/_apply_oracle_manifest_patch.py"
      - ".github/workflows/_apply-oracle-manifest-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/aassr-v2-imagination-counterfactual-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/_apply_oracle_manifest_patch.py
      - run: python -m compileall -q src/aassr_v2/autonomous_experiment.py
      - run: |
          git rm scripts/_apply_oracle_manifest_patch.py
          git rm .github/workflows/_apply-oracle-manifest-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/aassr_v2/autonomous_experiment.py
          git commit -m "Declare privileged oracle analysis boundaries"
          git push origin HEAD:codex/aassr-v2-imagination-counterfactual-audit
