name: effect-imagination-diagnostic

on:
  push:
    branches: [codex/aassr-v2-imagination-counterfactual-audit]
    paths:
      - ".github/workflows/effect-imagination-diagnostic.yml"
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Run matched diagnostic
        run: |
          python scripts/run_experiment.py \
            --config configs/effect_imagination_diagnostic.json \
            --output runs/effect_imagination_diagnostic \
            --overwrite \
            --workers 4 \
            --device cpu
      - name: Upload diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: effect-imagination-diagnostic-${{ github.sha }}
          path: runs/effect_imagination_diagnostic
          if-no-files-found: error
          retention-days: 30
