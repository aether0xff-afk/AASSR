name: Wiki beginner language pass

on:
  push:
    branches:
      - docs/wiki-beginner-korean-pass
    paths:
      - scripts/koreanize_wiki_prose.py
      - scripts/koreanize_wiki_common_jargon.py
      - scripts/koreanize_wiki_remaining_jargon.py
      - scripts/fix_wiki_beginner_compounds.py
      - scripts/check_wiki_beginner_language.py
      - scripts/audit_wiki_bare_english.py
      - .github/workflows/wiki-beginner-language-pass.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/wiki-beginner-korean-pass
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply core Korean-first terminology pass
        run: python scripts/koreanize_wiki_prose.py
      - name: Apply common research-jargon Korean-first pass
        run: python scripts/koreanize_wiki_common_jargon.py
      - name: Apply remaining deep-page jargon pass
        run: python scripts/koreanize_wiki_remaining_jargon.py
      - name: Fix compound terminology and preserve research markers
        run: python scripts/fix_wiki_beginner_compounds.py
      - name: Validate wiki links and current contracts
        run: python scripts/check_wiki_integrity.py
      - name: Validate beginner-friendly Korean-first prose
        run: python scripts/check_wiki_beginner_language.py
      - name: Audit unexpected bare English
        run: python scripts/audit_wiki_bare_english.py
      - name: Commit generated wiki prose changes
        run: |
          set -euo pipefail
          if git diff --quiet -- wiki; then
            echo 'No wiki prose changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wiki
          git commit -m 'Expand Korean-first Wiki prose'
          git push origin HEAD:docs/wiki-beginner-korean-pass
