name: tests

on:
  push:
    branches: [aassr-v2, aassr-v2-generalization-cuda]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run portable full test suite in parallel
        run: pytest -q -n auto -m "not docker"

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional PyTorch path
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,gpu]"
      - name: Run PyTorch GRU CPU regression
        run: pytest -q tests/test_reliability_regressions.py -k torch_gru_cpu_optional

  goal-gridpush-diagnostic:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/aassr-v2-imagination-counterfactual-audit'
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 13, 21, 42, 100]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Run one-seed GOAL GridPush diagnostic
        run: |
          python scripts/run_goal_gridpush_experiment.py \
            --output runs/goal_gridpush_seed_${{ matrix.seed }} \
            --seeds ${{ matrix.seed }} \
            --train-episodes 40 \
            --train-maps 8 \
            --eval-episodes 10 \
            --training-tail 10
      - name: Upload GOAL GridPush output
        uses: actions/upload-artifact@v4
        with:
          name: goal-gridpush-seed-${{ matrix.seed }}-${{ github.sha }}
          path: runs/goal_gridpush_seed_${{ matrix.seed }}
          retention-days: 30
