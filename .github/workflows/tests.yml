name: tests

on:
  push:
    branches: [aassr-v2, aassr-v2-generalization-cuda]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run portable full test suite in parallel
        run: pytest -q -n auto -m "not docker"

  pentest-http-two-seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
      - name: Run seed 7 and 42 HTTP lab behavior check
        run: |
          python scripts/run_pentest_http_lab_two_seed_check.py \
            --output runs/pentest_http_two_seed_check.json
      - name: Archive two-seed trace
        uses: actions/upload-artifact@v4
        with:
          name: pentest-http-two-seed-check
          path: runs/pentest_http_two_seed_check.json
          if-no-files-found: error

  pentest-http-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e .
      - name: Run 40-seed difficulty and baseline benchmark
        run: |
          python scripts/run_pentest_http_benchmark.py \
            --output-dir runs/pentest_http_benchmark \
            --eval-seeds 40 \
            --random-trials 12 \
            --browse-trials 8 \
            --guided-trials 1 \
            --q-trials 4 \
            --q-train-episodes 3000
      - name: Archive benchmark outputs
        uses: actions/upload-artifact@v4
        with:
          name: pentest-http-benchmark
          path: runs/pentest_http_benchmark
          if-no-files-found: error

  pentest-transfer-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,gpu]"
      - name: Run focused transfer regressions
        run: pytest -q tests/test_pentest_transfer_diagnostic.py
      - name: Run checkpoint cross-difficulty diagnostic
        run: |
          python scripts/run_pentest_transfer_diagnostic.py \
            --output-dir runs/transfer \
            --research-seed 20260807 \
            --transition-budget 6000 \
            --evaluation-seed-count 8 \
            --block-transitions 256
      - name: Archive transfer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pentest-agent-transfer-diagnostic
          path: runs/transfer
          if-no-files-found: error

  torch-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional PyTorch path
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev,gpu]"
      - name: Run PyTorch GRU CPU regression
        run: pytest -q tests/test_reliability_regressions.py -k torch_gru_cpu_optional
