name: imagination-v2

on:
  push:
    branches:
      - codex/aassr-v2-imagination-v2
  pull_request:
    paths:
      - "src/aassr_v2/imagination_tree.py"
      - "src/aassr_v2/imagination_v2.py"
      - "src/aassr_v2/imagination_v2_experiment.py"
      - "scripts/run_imagination_v2_experiment.py"
      - "scripts/aggregate_imagination_v2_results.py"
      - "tests/test_imagination_v2.py"
      - ".github/workflows/imagination-v2.yml"
  workflow_dispatch:

jobs:
  focused-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and focused tests
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_imagination_v2.py tests/test_critic_prophecy_audit.py

  pilot:
    needs: focused-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 13, 21, 42, 100]
        condition:
          - dqn
          - legacy_aassr
          - controlled_legacy
          - neural_manual
          - legacy_gru_critic
          - imagination_v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and CPU PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run condition
        run: |
          python scripts/run_imagination_v2_experiment.py \
            --output runs/${{ matrix.condition }}_${{ matrix.seed }} \
            --condition ${{ matrix.condition }} \
            --seed ${{ matrix.seed }} \
            --train-episodes 1000 \
            --train-map-count 64 \
            --evaluation-episodes 100 \
            --checkpoints 0 100 250 500 1000
      - uses: actions/upload-artifact@v4
        with:
          name: imagination-v2-${{ matrix.condition }}-${{ matrix.seed }}-${{ github.sha }}
          path: runs/${{ matrix.condition }}_${{ matrix.seed }}
          if-no-files-found: error

  aggregate:
    needs: pilot
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: imagination-v2-*
          path: downloaded-results
      - name: Aggregate completed conditions
        run: |
          python scripts/aggregate_imagination_v2_results.py \
            --input downloaded-results \
            --output imagination_v2_five_seed_summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: imagination-v2-five-seed-summary-${{ github.sha }}
          path: imagination_v2_five_seed_summary.json
          if-no-files-found: error
