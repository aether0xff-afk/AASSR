name: baseline-efficiency-benchmark

on:
  pull_request:
    branches:
      - aassr-v2
      - codex/aassr-v2-imagination-counterfactual-audit
    paths:
      - "src/aassr_v2/baseline_efficiency_benchmark.py"
      - "src/aassr_v2/baseline_efficiency_portable.py"
      - "scripts/run_baseline_efficiency_benchmark.py"
      - "tests/test_baseline_efficiency_benchmark.py"
      - ".github/workflows/baseline-efficiency-benchmark.yml"
  workflow_dispatch:
    inputs:
      train_episodes:
        description: Training episodes per seed and condition
        required: false
        default: "1000"
      evaluation_episodes:
        description: Seen and unseen evaluation episodes per checkpoint
        required: false
        default: "50"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and test benchmark
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_baseline_efficiency_benchmark.py

  light-baselines:
    needs: focused-tests
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [7, 13, 21, 42, 100]
        condition: [random, q_learning, policy_only, aassr_full]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Run matched benchmark
        shell: bash
        env:
          TRAIN_EPISODES: ${{ inputs.train_episodes || '1000' }}
          EVALUATION_EPISODES: ${{ inputs.evaluation_episodes || '50' }}
        run: |
          python scripts/run_baseline_efficiency_benchmark.py \
            --condition "${{ matrix.condition }}" \
            --seed "${{ matrix.seed }}" \
            --train-episodes "$TRAIN_EPISODES" \
            --evaluation-episodes "$EVALUATION_EPISODES" \
            --checkpoints "0,50,100,250,500,$TRAIN_EPISODES" \
            --output "runs/baseline_${{ matrix.condition }}_${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.condition }}-${{ matrix.seed }}-${{ github.sha }}
          path: runs/baseline_${{ matrix.condition }}_${{ matrix.seed }}
          retention-days: 30

  dqn:
    needs: focused-tests
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [7, 13, 21, 42, 100]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run matched DQN benchmark
        shell: bash
        env:
          TRAIN_EPISODES: ${{ inputs.train_episodes || '1000' }}
          EVALUATION_EPISODES: ${{ inputs.evaluation_episodes || '50' }}
        run: |
          python scripts/run_baseline_efficiency_benchmark.py \
            --condition dqn \
            --seed "${{ matrix.seed }}" \
            --train-episodes "$TRAIN_EPISODES" \
            --evaluation-episodes "$EVALUATION_EPISODES" \
            --checkpoints "0,50,100,250,500,$TRAIN_EPISODES" \
            --output "runs/baseline_dqn_${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-dqn-${{ matrix.seed }}-${{ github.sha }}
          path: runs/baseline_dqn_${{ matrix.seed }}
          retention-days: 30
