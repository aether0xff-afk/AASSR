name: Imagination intervention detailed trace

# Expensive trace experiment. Run manually only after the implementation contract
# is frozen; ordinary pushes are covered by unit/current-generation gates.
on:
  workflow_dispatch:

jobs:
  reduced-detailed-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and Torch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install torch

      - name: Compile detailed trace runner
        run: python -m py_compile scripts/run_imagination_intervention_trace.py

      - name: Run reduced detailed intervention trace
        run: |
          python scripts/run_imagination_intervention_trace.py \
            --output-dir runs/imagination_intervention_trace_reduced_seed7 \
            --seed 7 \
            --transitions 2048 \
            --block-target 512 \
            --margin 0.05 \
            --max-level 4 \
            --seed-count 4 \
            --device cpu

      - name: Print intervention trace
        if: always()
        run: |
          if [ -f runs/imagination_intervention_trace_reduced_seed7/intervention_trace_aassr_gate_margin_0p05.jsonl ]; then
            cat runs/imagination_intervention_trace_reduced_seed7/intervention_trace_aassr_gate_margin_0p05.jsonl
          fi

      - name: Upload detailed trace artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagination-intervention-detailed-trace-reduced-seed7
          path: runs/imagination_intervention_trace_reduced_seed7
          if-no-files-found: warn
