name: bottleneck-sota-diagnostic

on:
  pull_request:
    branches:
      - codex/aassr-v2-baseline-efficiency-benchmark
    paths:
      - "src/aassr_v2/bottleneck_sota_*.py"
      - "scripts/run_bottleneck_sota_diagnostic.py"
      - "scripts/summarize_bottleneck_sota.py"
      - "tests/test_bottleneck_sota_diagnostic.py"
      - "docs/bottleneck_sota_audit_plan.md"
      - ".github/workflows/bottleneck-sota-diagnostic.yml"
  workflow_dispatch:
    inputs:
      train_episodes:
        description: Training episodes per learned condition
        required: false
        default: "1000"
      evaluation_episodes:
        description: Seen and unseen evaluation episodes per checkpoint
        required: false
        default: "50"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and run focused tests
        run: |
          python -m compileall -q src tests scripts
          pytest -q tests/test_bottleneck_sota_diagnostic.py
      - name: Neural hybrid smoke test
        run: |
          python scripts/run_bottleneck_sota_diagnostic.py \
            --condition hybrid_current_model \
            --seed 7 \
            --train-episodes 20 \
            --train-map-count 8 \
            --evaluation-episodes 4 \
            --checkpoints 0,20 \
            --output runs/smoke_hybrid

  diagnostic-matrix:
    if: github.event_name == 'workflow_dispatch'
    needs: focused-tests
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        seed: [7, 13, 21, 42, 100]
        condition:
          - dqn
          - aassr_current
          - hybrid_current_model
          - hybrid_oracle_model
          - hybrid_current_model_oracle_score
          - hybrid_oracle_budgeted
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and PyTorch
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run bottleneck condition
        shell: bash
        env:
          TRAIN_EPISODES: ${{ inputs.train_episodes || '1000' }}
          EVALUATION_EPISODES: ${{ inputs.evaluation_episodes || '50' }}
        run: |
          python scripts/run_bottleneck_sota_diagnostic.py \
            --condition "${{ matrix.condition }}" \
            --seed "${{ matrix.seed }}" \
            --train-episodes "$TRAIN_EPISODES" \
            --evaluation-episodes "$EVALUATION_EPISODES" \
            --checkpoints "0,100,250,500,$TRAIN_EPISODES" \
            --output "runs/${{ matrix.condition }}_${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bottleneck-${{ matrix.condition }}-${{ matrix.seed }}-${{ github.sha }}
          path: runs/${{ matrix.condition }}_${{ matrix.seed }}
          retention-days: 30

  oracle-upper-bound:
    if: github.event_name == 'workflow_dispatch'
    needs: focused-tests
    strategy:
      fail-fast: false
      matrix:
        seed: [7, 13, 21, 42, 100]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Run exact upper bound
        run: |
          python scripts/run_bottleneck_sota_diagnostic.py \
            --condition oracle_bfs \
            --seed "${{ matrix.seed }}" \
            --train-episodes 1 \
            --train-map-count 64 \
            --evaluation-episodes 50 \
            --checkpoints 0,1 \
            --output "runs/oracle_bfs_${{ matrix.seed }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bottleneck-oracle-bfs-${{ matrix.seed }}-${{ github.sha }}
          path: runs/oracle_bfs_${{ matrix.seed }}
          retention-days: 30

  summarize:
    if: github.event_name == 'workflow_dispatch' && always()
    needs: [diagnostic-matrix, oracle-upper-bound]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: bottleneck-*
          path: downloaded
      - name: Summarize all completed conditions
        run: |
          python scripts/summarize_bottleneck_sota.py \
            --input downloaded \
            --output runs/bottleneck_summary
      - uses: actions/upload-artifact@v4
        with:
          name: bottleneck-sota-summary-${{ github.sha }}
          path: runs/bottleneck_summary
          retention-days: 30
