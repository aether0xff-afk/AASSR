name: pilot-experiment

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seeds overriding configs/pilot.json"
        required: false
        default: "7,13"
  pull_request:
    branches: [aassr-v2]

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Compile and test
        run: |
          python -m compileall -q src tests scripts
          pytest -q
      - name: Run pilot
        run: |
          python scripts/run_experiment.py \
            --config configs/pilot.json \
            --output runs/pilot \
            --overwrite \
            --seeds "${{ inputs.seeds }}"
      - name: Upload pilot outputs
        uses: actions/upload-artifact@v4
        with:
          name: aassr-v2-pilot-${{ github.sha }}
          path: runs/pilot
          if-no-files-found: error
          retention-days: 30
