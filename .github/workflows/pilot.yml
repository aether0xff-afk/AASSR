name: pilot-experiment

on:
  push:
    branches: [aassr-v2, aassr-v2-generalization-cuda]
  pull_request:
    branches: [aassr-v2]
    paths:
      - "src/aassr_v2/**"
      - "scripts/**"
      - "configs/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pilot.yml"
  workflow_dispatch:
    inputs:
      seeds:
        description: "Comma-separated seeds overriding configs/pilot.json"
        required: false
        default: "7,13,21,42,100"

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install -e ".[dev]"
      - name: Compile and parallel portable tests
        run: |
          python -m compileall -q src tests scripts
          pytest -q -n auto -m "not docker"
      - name: Run autonomous discovery smoke
        run: |
          python scripts/run_experiment.py \
            --config configs/autonomous_smoke.json \
            --output runs/autonomous_smoke \
            --overwrite \
            --workers 2 \
            --device cpu
      - name: Run final diagnostic pilot
        shell: bash
        run: |
          SEEDS="${{ inputs.seeds }}"
          if [ -n "$SEEDS" ]; then
            python scripts/run_experiment.py \
              --config configs/pilot.json \
              --output runs/final_pilot \
              --overwrite \
              --seeds "$SEEDS"
          else
            python scripts/run_experiment.py \
              --config configs/pilot.json \
              --output runs/final_pilot \
              --overwrite
          fi
      - name: Run matched effect and Imagination intervention diagnostic
        if: github.head_ref == 'codex/aassr-v2-imagination-counterfactual-audit'
        run: |
          python scripts/run_experiment.py \
            --config configs/effect_imagination_diagnostic.json \
            --output runs/effect_imagination_diagnostic \
            --overwrite \
            --workers 4 \
            --device cpu
      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: aassr-v2-validation-${{ github.sha }}
          path: |
            runs/autonomous_smoke
            runs/final_pilot
            runs/effect_imagination_diagnostic
          if-no-files-found: warn
          retention-days: 30
